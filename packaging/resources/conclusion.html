<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.6 -apple-system, sans-serif; color: #171717; margin: 0 4px; }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 12px; }
  .muted { color: #737373; }
  ol { padding-left: 18px; }
  li { margin: 6px 0; }
  code { font: 12px ui-monospace, Menlo, monospace; background: rgba(127, 127, 127, 0.14); padding: 1px 5px; border-radius: 5px; }
  @media (prefers-color-scheme: dark) {
    body { color: #ededed; }
    .muted { color: #8f8f8f; }
  }
</style>
</head>
<body>
  <h1>설치했습니다</h1>
  <ol>
    <li>메뉴 막대에 팬 아이콘과 지금 온도가 보입니다. 누르면 온도, 팬 속도, 곡선이 나옵니다.</li>
    <li>응용 프로그램 폴더나 Spotlight에서 <b>FanCurve</b>를 열면 큰 창으로 볼 수 있습니다.</li>
    <li>기본 곡선은 50°C부터 팬을 올려 80°C에 최대입니다. 앱의 '조용 · 균형 · 시원'이나 슬라이더로 바꾸세요.</li>
  </ol>
  <p class="muted">제거하려면 터미널에서:<br>
  <code>sudo /Applications/FanCurve.app/Contents/Resources/uninstall.sh</code></p>
</body>
</html>
